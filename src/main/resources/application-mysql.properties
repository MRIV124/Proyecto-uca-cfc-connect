# Perfil MySQL - activar con: --spring.profiles.active=mysql
# (o -Dspring-boot.run.profiles=mysql con mvn spring-boot:run)
# Requiere tener MySQL corriendo; la base se crea sola gracias a
# createDatabaseIfNotExist=true.

spring.datasource.url=jdbc:mysql://localhost:3306/uca_cfc_connect?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false
