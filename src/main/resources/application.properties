spring.application.name=cfc-connect
server.port=8080

spring.datasource.url=jdbc:h2:mem:cfcconnect;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Los recursos estaticos del panel web (app.js, app.css) no se cachean, para
# que los cambios del frontend se vean al recargar el navegador.
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# =====================================================================
# Seguridad (Fase 3) - Spring Security + JWT
# =====================================================================

# Clave de firma de los tokens (HS256). Debe ser Base64 y decodificar a
# al menos 32 bytes. Generar una con: openssl rand -base64 32
# En produccion, sobreescribir con la variable de entorno APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:YmRkZmQ5ODQ4MTg3NDRkNzk0MWM1NmM4MmMxZWE0Zjg=}

# Duracion de la validez del token, en segundos (3600 = 1 hora).
app.jwt.expiration-seconds=3600

# Emisor del token (claim "iss").
app.jwt.issuer=uca-cfc-connect

# Origenes permitidos por CORS (separados por comas). En produccion, indicar
# el dominio del frontend: app.cors.allowed-origins=https://mi-frontend.com
app.cors.allowed-origins=*

# Usuarios de prueba creados por el DataSeeder (contrasena cifrada con BCrypt).
app.security.admin.email=admin@cfc.edu.sv
app.security.admin.password=Admin123*
app.security.recepcionista.email=recepcion@cfc.edu.sv
app.security.recepcionista.password=Recepcion123*

# Para MySQL: ejecutar con --spring.profiles.active=mysql
